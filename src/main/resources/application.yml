spring:
    application:
        name: shuati
    profiles:
        active: dev
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/shuati
        username: root
        password: 123456
    servlet:
        multipart:
            enabled: true
            max-file-size: 100MB
            max-request-size: 100MB
    redis:
        database: 1
        host: localhost
        port: 6379
server:
    port: 8101
    address: 0.0.0.0
    servlet:
        context-path: /api
mybatis-plus:
    configuration:
        map-underscore-to-camel-case: false
    global-config:
        db-config:
            id-type: auto
# sa-token 配置
sa-token:
    #token名称(同时也是cookie名称)
    token-name: qfshuati
    #token有效期
    timeout: 2592000
    # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
    active-timeout: -1
    # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
    is-concurrent: false
    # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
    is-share: true
    # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
    token-style: uuid
    # 是否输出操作日志
    is-log: true
cos:
    client:
        secretKey: XXX
        region: XXXX
        bucket: XXXX
        accessKey: XXXX
